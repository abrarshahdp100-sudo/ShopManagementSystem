<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Shop - Online Ordering Store</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
                tailwind.config = {
                    darkMode: 'class',
                    theme: {
                        extend: {
                            fontFamily: { sans: ['Inter', 'sans-serif'] },
                            colors: { darkblue: { 900: '#0b192c', 800: '#1e3e62', 700: '#0f172a' } }
                        }
                    }
                }
    </script>
</head>
<body class="bg-darkblue-900 text-slate-100 font-sans min-h-screen flex flex-col antialiased">

    <!-- Header -->
    <header class="bg-darkblue-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-xl">
        <div class="flex items-center space-x-3">
            <div class="bg-emerald-600 p-2.5 rounded-xl text-white text-xl shadow-lg">
                <i class="fa-solid fa-cart-shopping"></i>
            </div>
            <div>
                <h1 class="text-lg font-black tracking-wide text-white">Smart Shop Online Store</h1>
                <p class="text-xs text-emerald-400 font-bold">Ghar Baithe Order Karein & Home Delivery Payein</p>
            </div>
        </div>
        <div>
            <span class="text-xs bg-emerald-500/20 text-emerald-300 px-3 py-1.5 rounded-xl font-bold border border-emerald-500/30">
                <i class="fa-solid fa-truck-fast mr-1"></i> Cash on Delivery
            </span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-6 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- Products List -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-darkblue-800 border border-slate-700 rounded-3xl p-6 shadow-2xl space-y-4">
                <h2 class="font-black text-base text-emerald-400 border-b border-slate-700 pb-3">
                    <i class="fa-solid fa-box-open mr-2"></i> Maujuda Products & Items
                </h2>

                <div id="customerProductsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Dynamic Products Loaded Here -->
                </div>
            </div>
        </div>

        <!-- Customer Checkout Form & Cart -->
        <div class="bg-darkblue-800 border border-slate-700 rounded-3xl p-6 shadow-2xl flex flex-col justify-between space-y-6">
            <div>
                <h2 class="font-black text-base text-blue-400 border-b border-slate-700 pb-3 mb-4">
                    <i class="fa-solid fa-receipt mr-2"></i> Aap Ka Cart & Order
                </h2>

                <div id="customerCartList" class="space-y-3 max-h-60 overflow-y-auto pr-2 mb-4">
                    <p class="text-xs text-slate-400 text-center py-6 font-medium">Cart khali hai. Products select karein.</p>
                </div>

                <!-- Customer Details Form -->
                <div class="space-y-3 border-t border-slate-700 pt-4">
                    <h3 class="text-xs font-black text-slate-300 uppercase tracking-wider">Delivery Details:</h3>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1">Aap Ka Naam</label>
                        <input type="text" id="custName" placeholder="e.g. Muhammad Ali" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-bold focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1">Mobile Number</label>
                        <input type="text" id="custPhone" placeholder="0300-1234567" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-bold focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 mb-1">Ghar Ka Pura Pata (Address)</label>
                        <textarea id="custAddress" rows="2" placeholder="House #, Street #, Area Name" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-bold focus:outline-none focus:border-emerald-500"></textarea>
                    </div>
                </div>
            </div>

            <div class="border-t border-slate-700 pt-4 space-y-3">
                <div class="flex justify-between text-base font-black">
                    <span class="text-slate-100">Kul Raqam (Total):</span>
                    <span id="customerCartTotal" class="text-emerald-400 text-lg">Rs. 0</span>
                </div>
                <button onclick="placeOnlineOrder()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 rounded-2xl shadow-xl transition text-sm">
                    <i class="fa-solid fa-paper-plane mr-1"></i> Order Submit Karein
                </button>
            </div>
        </div>

    </main>

    <!-- Script Logic -->
    <script>
                let customerCart = [];
                let allProducts = [];

                window.onload = function() {
                    loadStoreProducts();
                };

                function loadStoreProducts() {
                    const customProducts = JSON.parse(localStorage.getItem('customShopProducts')) || [];
                    const looseOils = JSON.parse(localStorage.getItem('customLooseOils')) || [];

                    allProducts = [
                        ...customProducts.map(p => ({ id: p.id, name: p.name, price: p.price, type: 'packet' })),
                        ...looseOils.map(o => ({ id: o.id, name: o.name + ' (Khula)', price: o.rate, type: 'loose' }))
                    ];

                    const grid = document.getElementById('customerProductsGrid');
                    if (allProducts.length === 0) {
                        grid.innerHTML = `<div class="col-span-full text-center py-8 text-slate-400 text-xs font-bold">Filhal koi product available nahi hai.</div>`;
                        return;
                    }

                    grid.innerHTML = allProducts.map((p, index) => `
                        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-700 flex flex-col justify-between space-y-3 shadow">
                            <div>
                                <h3 class="font-bold text-sm text-white mb-1">${p.name}</h3>
                                <p class="text-emerald-400 font-black text-base">Rs. ${p.price.toLocaleString()} ${p.type === 'loose' ? '/ Kg' : ''}</p>
                            </div>
                            <button onclick="addToCustomerCart('${p.id}')" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-extrabold py-2 rounded-xl transition shadow">
                                <i class="fa-solid fa-cart-plus mr-1"></i> Cart Mein Dalen
                            </button>
                        </div>
                    `).join('');
                }

                function addToCustomerCart(id) {
                    const product = allProducts.find(p => p.id === id);
                    if (!product) return;

                    let existing = customerCart.find(item => item.id === id);
                    if (existing) {
                        existing.qty += 1;
                    } else {
                        customerCart.push({ id: product.id, name: product.name, price: product.price, qty: 1, type: product.type });
                    }
                    renderCustomerCart();
                }

                function renderCustomerCart() {
                    const list = document.getElementById('customerCartList');
                    if (customerCart.length === 0) {
                        list.innerHTML = `<p class="text-xs text-slate-400 text-center py-6 font-medium">Cart khali hai. Products select karein.</p>`;
                        document.getElementById('customerCartTotal').innerText = `Rs. 0`;
                        return;
                    }

                    let total = 0;
                    list.innerHTML = customerCart.map((item, index) => {
                        let itemTotal = item.price * item.qty;
                        total += itemTotal;
                        return `
                            <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-700 flex justify-between items-center text-xs">
                                <div>
                                    <p class="font-bold text-white">${item.name} (${item.qty}x)</p>
                                    <p class="text-emerald-400 font-bold">Rs. ${itemTotal.toLocaleString()}</p>
                                </div>
                                <button onclick="removeCustomerItem(${index})" class="text-rose-400 hover:text-rose-300 px-2 py-1">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        `;
                    }).join('');
                    document.getElementById('customerCartTotal').innerText = `Rs. ${total.toLocaleString()}`;
                }

                function removeCustomerItem(index) {
                    customerCart.splice(index, 1);
                    renderCustomerCart();
                }

                function placeOnlineOrder() {
                    if (customerCart.length === 0) {
                        alert("Pehle cart mein items add karein!");
                        return;
                    }
                    const name = document.getElementById('custName').value.trim();
                    const phone = document.getElementById('custPhone').value.trim();
                    const address = document.getElementById('custAddress').value.trim();

                    if (!name || !phone || !address) {
                        alert("Mahrbani karke apna Naam, Mobile Number aur Address mukammal likhein!");
                        return;
                    }

                    let totalAmount = customerCart.reduce((sum, item) => sum + (item.price * item.qty), 0);

                    let newOrder = {
                        id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                        customerName: name,
                        customerPhone: phone,
                        customerAddress: address,
                        items: customerCart,
                        totalAmount: totalAmount,
                        status: 'Pending',
                        date: new Date().toLocaleString()
                    };

                    let ordersList = JSON.parse(localStorage.getItem('onlineCustomerOrders')) || [];
                    ordersList.unshift(newOrder);
                    localStorage.setItem('onlineCustomerOrders', JSON.stringify(ordersList));

                    alert("✅ Aapka Order Successfully Place Ho Gaya Hai! Owner jald apse rabta karega.");
                    customerCart = [];
                    document.getElementById('custName').value = '';
                    document.getElementById('custPhone').value = '';
                    document.getElementById('custAddress').value = '';
                    renderCustomerCart();
                }
    </script>
</body>
</html>
